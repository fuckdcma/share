name: YiGu Vietnamese - static QA and install ZIP
on:
  push:
    branches:
      - 'review/yigu-sau-b59-qa-20261026'
  workflow_dispatch:
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed translations
        uses: actions/checkout@v4
      - name: Validate all accumulated XML and make installable ZIP
        run: python "59 Tich Luy/qa_final_yigu.py"
      - name: Package authoritative CN and available EN reference XML for offline proofreading
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = []
          for folder in [Path('Yigu Three Kingdom Mod/ModuleData/Languages/CNs'), Path('Yigu Three Kingdom Mod/ModuleData/Languages/ENs')]:
              files.extend(folder.rglob('*.xml'))
          files.append(Path('Yigu Three Kingdom Mod/ModuleData/sg_heroes.xml'))
          files.extend(Path('Mount and Blade/Modules').glob('*/ModuleData/Languages/*.xml'))
          with ZipFile('release/YiGu_Nguon_CN_EN_DoiChieu.zip','w',ZIP_DEFLATED,compresslevel=8) as z:
              for f in sorted(set(files)):
                  if f.is_file(): z.write(f,f.as_posix())
          PY
      - name: Upload private QA reference corpus
        uses: actions/upload-artifact@v4
        with:
          name: YiGu_QA_CN_EN_References
          path: release/YiGu_Nguon_CN_EN_DoiChieu.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload final-review ZIP and QA reports
        uses: actions/upload-artifact@v4
        with:
          name: YiGu_Tam_Quoc_Viet_Hoa_Ra_Soat_Cuoi
          path: |
            release/YiGu_Tam_Quoc_Viet_Hoa_Ra_Soat_Cuoi.zip
            release/QA_*.csv
            release/QA_SUMMARY.json
            release/README_QA.md
          if-no-files-found: error
          retention-days: 30
